name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore WindowsBootSwitcher.sln

      - name: Build
        run: dotnet build WindowsBootSwitcher.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: >
          dotnet test WindowsBootSwitcher.sln -c Release -p:Platform=x64 --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn

      - name: Publish service
        run: dotnet publish src\WindowsBootSwitcher.Service\WindowsBootSwitcher.Service.csproj -c Release -r win-x64 -p:Platform=x64 -o artifacts\service

      - name: Publish tray
        run: dotnet publish src\WindowsBootSwitcher.Tray\WindowsBootSwitcher.Tray.csproj -c Release -r win-x64 -p:Platform=x64 -o artifacts\tray

      - name: Build installer
        run: dotnet build installer\WindowsBootSwitcher.Setup\WindowsBootSwitcher.Setup.wixproj -c Release -p:Platform=x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-boot-switcher
          # A '#' inside a block scalar is content, not a comment: every entry here must be a
          # real path or the upload silently keeps looking for a file named '# ...'.
          path: |
            artifacts/service/**
            artifacts/tray/**
            installer/WindowsBootSwitcher.Setup/bin/x64/Release/*.msi
          if-no-files-found: error
