name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WindowsBootSwitcher.sln

      - name: Build
        run: dotnet build WindowsBootSwitcher.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test WindowsBootSwitcher.sln -c Release -p:Platform=x64 --no-build

      # - name: Publish service
      #   run: dotnet publish src\WindowsBootSwitcher.Service\WindowsBootSwitcher.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts\service

      # - name: Publish tray
      #   run: dotnet publish src\WindowsBootSwitcher.Tray\WindowsBootSwitcher.Tray.csproj -c Release -r win-x64 --self-contained true -o artifacts\tray

      - name: Build installer
        run: dotnet build installer\WindowsBootSwitcher.Setup\WindowsBootSwitcher.Setup.wixproj -c Release -p:Platform=x64 --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-boot-switcher
          path: |
            # artifacts\service
            # artifacts\tray
            installer\WindowsBootSwitcher.Setup\bin\x64\Release\WindowsBootSwitcher.Setup.msi
